name: Pubblica sito su GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara i file del sito
        run: |
          mkdir _site
          cp index.html style.css app.js manifest.json service-worker.js _site/
          for f in icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png; do
            if [ -f "$f" ]; then
              cp "$f" _site/
            else
              echo "Attenzione: $f non trovato nel repository, non verrà pubblicato (favicon/installazione PWA potrebbero non funzionare)."
            fi
          done

      - name: Inserisci la Firebase API key
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "Il secret FIREBASE_API_KEY è vuoto o mancante"; exit 1
          fi
          sed -i "s|__FIREBASE_API_KEY__|$FIREBASE_API_KEY|g" _site/app.js
          if grep -q "__FIREBASE_API_KEY__" _site/app.js; then
            echo "Segnaposto non sostituito in app.js"; exit 1
          fi

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v5
