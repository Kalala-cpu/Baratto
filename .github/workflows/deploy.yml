name: Pubblica sito su GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara i file del sito
        run: |
          mkdir _site
          cp index.html style.css app.js manifest.json service-worker.js _site/
          for f in icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png; do
            if [ -f "$f" ]; then
              cp "$f" _site/
            else
              echo "Attenzione: $f non trovato nel repository, non verrà pubblicato (favicon/installazione PWA potrebbero non funzionare)."
            fi
          done

      - name: Inserisci la Firebase API key (offuscata in Base64)
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          # NOTA: questo offusca solo il sorgente pubblicato (niente chiave in chiaro
          # leggibile a colpo d'occhio su GitHub/view-source). Non è una vera protezione:
          # la chiave viaggia comunque in chiaro nelle richieste di rete a Firebase.
          # La protezione reale va fatta lato Google Cloud Console (restrizione per
          # referrer HTTP) e/o con Firebase App Check.
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "Il secret FIREBASE_API_KEY è vuoto o mancante"; exit 1
          fi
          FIREBASE_API_KEY_B64=$(printf '%s' "$FIREBASE_API_KEY" | base64 -w0)
          sed -i "s|__FIREBASE_API_KEY_B64__|$FIREBASE_API_KEY_B64|g" _site/app.js
          if grep -q "__FIREBASE_API_KEY_B64__" _site/app.js; then
            echo "Segnaposto non sostituito in app.js"; exit 1
          fi

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v5
