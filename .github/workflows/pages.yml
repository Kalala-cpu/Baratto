name: Pubblica sito su GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Inserisci la Firebase API key
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          sed -i "s|__FIREBASE_API_KEY__|$FIREBASE_API_KEY|g" script.js

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara i file del sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
